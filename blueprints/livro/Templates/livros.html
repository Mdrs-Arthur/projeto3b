{% extends 'base.html' %}

{% block cont %}
<div class="corpo">
    <h2>Buscar livros</h2>

    <form method="GET" action="{{ url_for('livro.livros' ) }}" class="busca">
        <input type="text" name="titulo" placeholder="Buscar por título">
        <input type="text" name="genero" placeholder="Buscar por gênero">
        <button type="submit">Buscar</button>
    </form>
    
    <div class="livros">
        <h2>Livros da Biblioteca</h2>
        <ul>
            {% for livro in livros %}
                <li>
                    <div class="livro-info">
                        <h3>{{ livro.titulo }}</h3>
                        <p>{{ livro.genero }}</p>

                        <a href="{{ url_for('livro.detalhe', livro_id=livro.id ) }}">Detalhar Livro</a>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}

{% block estilo %}
<style>
.container{
  display: flex;
}
.corpo{
    width: 90%;
    box-shadow: none;
    display: flex;
    flex-direction: column;
}
form{
    gap: 10px;
}
.livros{
    width: 100%;
    display: flex;
    flex-direction: column;
}
.livro-info p{
    margin: 0;
    margin-bottom: 20px;
    background-color: white;
}
h2{
    width: 100%;
    background-color: rgb(173, 207, 238);
    border-bottom: 5px solid rgb(97, 155, 209);
    padding: 10px;
    text-align: center;
}
h3{
    margin-bottom: 0;
}
ul{
    display: flex;
    flex-direction: row;
    gap: 20px;
    list-style: none;
    padding: 0;
    margin: 0;
}
li{
    display: flex;
    flex-direction: column;
    box-shadow: 0px 0px 2px gray;
    padding: 10px;
    border-radius: 10px;
    width: 20%;
}
button{
    width: 50%;
    font-size: 15px;
}
.flash{
    width: 100%;
}
.busca{
    flex-direction: row;
}
.busca input, .busca button{
    width: 30%;
    padding: 10px;
}
.busca button:hover{
    transform: none;
}
.a{
    margin-top: 10px;
}
</style>
{% endblock %}
